name: Secrets Demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/04_secrets_demo.yml"
  workflow_dispatch:
    inputs:
      greeting:
        description: "Enter a greeting message"
        required: true
        default: "Hello from manual trigger!"
        type: string

jobs:
  secret-demo:
    runs-on: ubuntu-latest
    env:
      MY_KEY: ${{ secrets.DEMO_API_KEY }}

    steps:
      - name: Show greeting
        run: echo "Input greeting - ${{ github.event.inputs.greeting }}"

      - name: Try to print secret (will be masked)
        run: |
          echo "=== Secret masking demo ==="
          echo "Direct ref: ${{ secrets.DEMO_API_KEY }}"
          echo "Via env var: $MY_KEY"

      - name: Check if secret exists
        run: |
          if [ -n "$MY_KEY" ]; then
            echo "Secret is set (value is hidden)"
          else
            echo "Secret is NOT set"
          fi

      - name: Try partial reveal
        run: |
          PARTIAL=$(echo "$MY_KEY" | cut -c1-3)
          echo "First 3 chars: $PARTIAL"
