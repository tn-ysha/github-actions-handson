# シークレットと手動トリガー(workflow_dispatch)のデモ
name: Secrets Demo

# ★新概念: workflow_dispatch（手動トリガー）
# GitHub の Actions タブから「Run workflow」ボタンで起動できる
# inputs で実行時にパラメータを受け取ることも可能
on:
  # push トリガー: まずシークレットのマスク体験を優先
  push:
    branches: [main]
    paths:
      - ".github/workflows/04_secrets_demo.yml"  # このファイルが変わった時だけ発火
  # 手動トリガー: GitHub がインデックス更新したら使えるようになる
  workflow_dispatch:
    inputs:
      greeting:
        description: "挨拶メッセージを入力してください"
        required: true
        default: "Hello from manual trigger!"
        type: string

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    # ★ secrets を環境変数にセットする方法
    env:
      MY_KEY: ${{ secrets.DEMO_API_KEY }}

    steps:
      - name: Show greeting (manual input)
        run: echo "入力値: ${{ github.event.inputs.greeting }}"

      # シークレットを echo しようとするとどうなるか？
      - name: Try to print secret (masked!)
        run: |
          echo "=== シークレットのマスク体験 ==="
          echo "直接参照: ${{ secrets.DEMO_API_KEY }}"
          echo "環境変数経由: $MY_KEY"
          echo "長さだけ確認: ${#MY_KEY} 文字"

      # シークレットを使った条件分岐
      - name: Check if secret exists
        run: |
          if [ -n "$MY_KEY" ]; then
            echo "シークレットが設定されています（値は見えません）"
          else
            echo "シークレットが未設定です"
          fi

      # シークレットの一部を表示しようとしても...
      - name: Try partial reveal
        run: |
          echo "先頭3文字: $(echo $MY_KEY | cut -c1-3)"
          echo "末尾3文字: $(echo $MY_KEY | cut -c-3)"
