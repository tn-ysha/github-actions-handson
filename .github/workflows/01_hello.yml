name: Hello World
on: [push]

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello, GitHub Actions!"

      - name: Show Info
        run: |
          echo "リポジトリ: ${{ github.repository }}"
          echo "ブランチ: ${{ github.ref_name }}"
          echo "実行者: ${{ github.actor }}"
